# Builds the release exe on GitHub. A signed build can then be traced back to this repo.
name: release build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        shell: pwsh
        run: ./tools/publish.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: DraftKeeper
          path: dist/win-x64/DraftKeeper.exe
